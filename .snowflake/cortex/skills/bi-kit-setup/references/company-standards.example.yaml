# Example only: a fictional company, used by tests and the gallery app.
company:
  name: "Acme Tire Co"
  standards_owner: "Analytics Platform team"
  last_reviewed: "2026-10-13"

environments:
  prototype:
    database: "BI_KIT_DEMO"
    schema_pattern: "PROTO_{username}"
  dev:  { database: "ACME_DEV",  schema: "BI_APPS" }
  test: { database: "ACME_TEST", schema: "BI_APPS" }
  prod: { database: "ACME_PROD", schema: "BI_APPS" }
  naming:
    objects: "UPPER_SNAKE_CASE"
    app_prefix: "BI_"

access:
  build_role: "BI_ANALYST"
  viewer_roles: ["BI_VIEWER_NA", "BI_VIEWER_EU", "BI_VIEWER_APAC"]
  shared_app_role: "BI_APP_OWNER"
  external_sharing_allowed: false
  cowork_publish_role: "BI_PUBLISHER"
  row_level_security_note: "Region filtering is enforced by a row access policy on the sales fact."

compute:
  warehouse: "BI_XS_WH"
  profiling_warehouse: "BI_XS_WH"
  streamlit_compute_pool: "BI_STREAMLIT_POOL"
  external_access_integration: "PYPI_ACCESS"

brand:
  primary_color: "#1F4E79"
  chart_palette: ["#1F4E79", "#F2A900", "#5B8DB8", "#A23B2A", "#6C8E3E", "#7F6A93"]
  positive_color: "#2E7D32"
  negative_color: "#C62828"
  font_family: "Inter, Helvetica, Arial, sans-serif"
  logo_stage_path: ""
  number_format: "{:,.0f}"
  currency: "USD"
  currency_format: "${:,.0f}"
  percent_format: "{:.1%}"
  date_format: "%b %Y"
  language: "en"
  timezone: "America/New_York"
  fiscal_calendar:
    type: "calendar"
    fiscal_year_start_month: 1
    calendar_table: ""

trusted_data:
  semantic_views: []
  certified_tables: []
  metric_definitions:
    - name: "Net sales"
      definition: "Gross sales minus returns and allowances, USD, excludes intercompany"
      source: "synthetic: NET_SALES_USD"
    - name: "Return rate"
      definition: "Returned units / shipped units, per month"
      source: "synthetic: RETURN_RATE"

visual_overrides:
  kpi: "Show change vs last year unless the brief names a plan."

handoff:
  receiving_team: "Data Engineering"
  intake: "Jira project DATAENG, component 'BI prototypes'"
  required_fields: ["Business owner", "Refresh need", "Expected viewers"]
  doc_standards: "README must name the business owner and the refresh need."

debug:
  prototype: "on"
  production: "remove"
