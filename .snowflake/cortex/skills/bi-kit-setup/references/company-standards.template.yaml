# snow-bi-kit company standards
# How our Streamlit (and Snowflake App Runtime) apps look and behave. Written by the bi-kit-setup skill.
# Deliberately NOT here: where apps deploy, roles, warehouses, compute pools. Those live in each
# project's deployment config (snowflake.yml / app.yml targets), managed by the bundled Streamlit and Apps skills.
# Where the kit looks for this file: standards-lookup.md in the bi-kit-library skill
# (convention: a stage named STANDARDS in a schema named BI_KIT, e.g. @ANALYTICS.BI_KIT.STANDARDS/company-standards.yaml).
# Every key is optional; anything blank falls back to a sensible default.

company:
  name: ""                      # e.g. "Acme Tire Co"
  standards_owner: ""           # person/team to ask about these rules
  last_reviewed: ""             # YYYY-MM-DD

brand:
  primary_color: ""             # hex, e.g. "#1F4E79"
  chart_palette: []             # ordered hex list for categories
  positive_color: ""            # good change
  negative_color: ""            # bad change
  font_family: ""               # e.g. "Inter, sans-serif"
  logo_stage_path: ""           # e.g. "@ANALYTICS.BI_KIT.STANDARDS/logo.png"

formats:
  number_format: "{:,.0f}"
  currency: "USD"
  currency_format: "${:,.0f}"
  percent_format: "{:.1%}"
  date_format: "%Y-%m-%d"
  language: "en"                # default label language, e.g. "en", "zh-CN"
  timezone: "UTC"
  fiscal_calendar:              # leave type blank if fiscal = calendar year
    type: ""                    # "calendar" | "4-4-5" | "shifted"
    fiscal_year_start_month: 1
    calendar_table: ""          # optional governed calendar table

trusted_data:
  semantic_views: []            # preferred governed sources, fully qualified
  certified_tables: []
  metric_definitions:           # pre-fill the measures question in bi-kit-start; analysts confirm
    # - name: "Net sales"
    #   definition: "Gross sales minus returns and allowances, USD, excludes intercompany"
    #   source: "SALES_DB.MART.SV_SALES.NET_SALES_USD"

house_rules:
  how_built_panels: "on"        # on | off  ("How this was built" panel under every visual)
  production_panels: "off"      # off (DEBUG = False) | remove (strip the panel code)
  visual_overrides:             # company tweaks to the visual library
    # kpi: "Always compare to plan, not last year"
  notes: ""                     # anything else every app should follow, in plain words

handoff:                        # optional: pre-fills the questions in bi-kit-handoff
  receiving_team: ""            # who takes prototypes to production
  intake: ""                    # Jira project, email, channel
  required_fields: []           # extra fields the receiving team wants in HANDOFF.md
