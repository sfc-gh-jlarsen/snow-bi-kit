# snow-bi-kit company standards
# Filled in once by a lead via the bi-kit-setup skill. Every kit command reads this file.
# Keys marked REQUIRED must be filled; commands stop with a clear message if they're blank.
# Where the kit looks for this file: see standards-lookup.md in the bi-kit-library skill
# (./bi-kit/company-standards.yaml, then the stage path in ./bi-kit/standards-location.txt)

company:
  name: ""                      # REQUIRED  e.g. "Acme Tire Co"
  standards_owner: ""           # REQUIRED  person/team to ask about these rules
  last_reviewed: ""             # YYYY-MM-DD

environments:                   # where things live at each stage
  prototype:
    database: ""                # REQUIRED  where analysts may build
    schema_pattern: ""          # REQUIRED  e.g. "PROTO_{username}" or a shared schema name
  dev:  { database: "", schema: "" }
  test: { database: "", schema: "" }
  prod: { database: "", schema: "" }
  naming:
    objects: "UPPER_SNAKE_CASE"
    app_prefix: ""              # e.g. "BI_" for Streamlit apps

access:
  build_role: ""                # REQUIRED  role analysts build with
  viewer_roles: []              # roles that may be granted app/report access
  shared_app_role: ""           # role that owns shared apps (never a personal or admin role)
  external_sharing_allowed: false   # may apps be embedded for people without Snowflake logins?
  cowork_publish_role: ""       # who may publish to CoWork (MANAGE ARTIFACT PUBLICATION)
  row_level_security_note: ""   # e.g. "Region filtering is enforced by row access policy on SALES"

compute:
  warehouse: ""                 # REQUIRED  default query warehouse (small)
  profiling_warehouse: ""       # optional; defaults to warehouse
  streamlit_compute_pool: ""    # needed for Streamlit (container runtime)
  external_access_integration: ""   # needed if apps install packages from PyPI

brand:
  primary_color: ""             # hex, e.g. "#1F4E79"
  chart_palette: []             # ordered hex list for categories
  positive_color: ""            # good change
  negative_color: ""            # bad change
  font_family: ""               # e.g. "Inter, sans-serif"
  logo_stage_path: ""           # e.g. "@BRAND.ASSETS.LOGOS/logo.png"
  number_format: "{:,.0f}"
  currency: "USD"
  currency_format: "${:,.0f}"
  percent_format: "{:.1%}"
  date_format: "%Y-%m-%d"
  language: "en"                # default label language, e.g. "en", "zh-CN"
  timezone: "UTC"
  fiscal_calendar:              # leave type blank if fiscal = calendar year
    type: ""                    # "calendar" | "4-4-5" | "shifted"
    fiscal_year_start_month: 1
    calendar_table: ""          # optional governed calendar table

trusted_data:
  semantic_views: []            # preferred governed sources, fully qualified
  certified_tables: []
  metric_definitions:           # pre-fill brief question 4; analysts confirm instead of retyping
    # - name: "Net sales"
    #   definition: "Gross sales minus returns and allowances, USD, excludes intercompany"
    #   source: "SALES_DB.MART.SV_SALES.NET_SALES_USD"

visual_overrides:               # company tweaks to the visual library
  # kpi: "Always compare to plan, not last year"

handoff:
  receiving_team: ""            # REQUIRED  who industrializes prototypes
  intake: ""                    # REQUIRED  how to send it: Jira project, email, channel
  required_fields: []           # extra fields the receiving team wants in HANDOFF.md
  doc_standards: ""             # e.g. "README must include owner and refresh SLA"

debug:
  prototype: "on"               # on | off
  production: "remove"          # off (flag) | remove (strip debug code)
